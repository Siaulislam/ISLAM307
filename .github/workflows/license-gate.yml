name: Dataset license gate

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject unapproved packaged content
        run: python tools/verification/check_dataset_license_gate.py
