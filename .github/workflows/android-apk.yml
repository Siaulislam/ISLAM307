name: Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/sahih-muslim-missing-data-7acb
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    name: Build test-signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Android platform scaffold
        run: |
          flutter create \
            --platforms=android \
            --org com.siaulislam \
            --project-name islam307 \
            app

      - name: Configure voice permissions
        run: python3 tools/flutter/configure_voice_permissions.py

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Remove generated template test
        run: rm -f app/test/widget_test.dart

      - name: Analyze Dart
        working-directory: app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        working-directory: app
        run: flutter test

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"

      - name: Prepare downloadable APK
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk \
            ISLAM307-release-test-signed.apk
          ls -lh ISLAM307-release-test-signed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ISLAM307-Android-APK
          path: ISLAM307-release-test-signed.apk
          if-no-files-found: error
          retention-days: 14
