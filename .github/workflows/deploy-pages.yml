# Build static preview site and deploy to GitHub Pages (like XMONEY).
# Live URL: https://siaulislam.github.io/ISLAM307/preview/
#
# One-time setup (if 404): Repo Settings → Pages → Source → Deploy from branch
#   Branch: gh-pages  Folder: / (root)
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-islam307
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Static site → gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static preview site
        run: python tools/design/build_gh_pages_site.py

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy ISLAM 307 preview (${{ github.sha }})"

      - name: Verify preview is publicly accessible
        id: verify
        run: |
          set -euo pipefail
          PAGE_URL="https://siaulislam.github.io/ISLAM307/"
          echo "Waiting for GitHub Pages CDN (up to ~3 minutes)…"
          ok=0
          for attempt in $(seq 1 12); do
            code="$(curl -sS -o /tmp/islam307-preview.html -w '%{http_code}' -L "${PAGE_URL}preview/" || true)"
            if [[ "$code" == "200" ]] && grep -qiE 'ISLAM 307|mockups' /tmp/islam307-preview.html; then
              ok=1
              break
            fi
            echo "Attempt ${attempt}/12 — HTTP ${code}, retrying in 15s…"
            sleep 15
          done
          if [[ "$ok" != "1" ]]; then
            echo "::warning::Preview not yet reachable at ${PAGE_URL}preview/"
            echo "Enable Pages once: Settings → Pages → Deploy from branch → gh-pages → / (root)"
            echo "preview_url=${PAGE_URL}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "preview_url=${PAGE_URL}" >> "$GITHUB_OUTPUT"
          echo "Preview verified: ${PAGE_URL}preview/"

      - name: Write preview URL to job summary
        env:
          PAGE_URL: ${{ steps.verify.outputs.preview_url }}
        run: |
          {
            echo "## ISLAM 307 Live Preview"
            echo ""
            echo "**${PAGE_URL}preview/**"
            echo ""
            echo "| Page | URL |"
            echo "|------|-----|"
            echo "| Preview hub | ${PAGE_URL}preview/ |"
            echo "| Phase 1 mockups | ${PAGE_URL}design/mockups/index.html |"
            echo "| Phase 3 mockups | ${PAGE_URL}design/mockups/phase3-mockups.html |"
            echo ""
            echo "If you see **404**, enable Pages once:"
            echo "Settings → Pages → **Deploy from a branch** → **gh-pages** → **/ (root)**"
          } >> "$GITHUB_STEP_SUMMARY"
