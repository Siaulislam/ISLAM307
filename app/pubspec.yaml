name: islam307
description: ISLAM 307 — offline-first Islamic platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/databases/quran.db
    - assets/databases/hadith.db.gz
    - assets/databases/tafsir.db.gz
    - assets/branding/
    - assets/branding/hadith/
