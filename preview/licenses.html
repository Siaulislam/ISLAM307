<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ISLAM 307 — Data Sources & Licenses</title>
  <style>
    :root { --emerald:#065f46; --gold:#c9a227; --muted:#64748b; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:Segoe UI,system-ui,sans-serif; background:linear-gradient(160deg,#f8fafc,#ecfdf5 40%,#fffbeb); min-height:100vh; color:#0f172a; padding:32px 18px 48px; }
    .wrap { max-width:820px; margin:0 auto; }
    h1 { color:var(--emerald); font-size:28px; margin:12px 0 8px; }
    .lead { color:var(--muted); line-height:1.6; margin-bottom:20px; }
    a.back { color:var(--emerald); font-weight:700; text-decoration:none; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:18px; margin-bottom:14px; }
    .card h2 { font-size:17px; color:var(--emerald); margin-bottom:8px; }
    .card p { font-size:14px; line-height:1.55; margin-bottom:6px; color:#334155; }
    .meta { font-size:12px; color:var(--muted); }
    .policy li { margin:6px 0 6px 18px; line-height:1.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Preview hub</a>
    <h1>About ISLAM 307 · Data Sources & Licenses</h1>
    <p class="lead">Only explicitly approved offline commercial datasets are packaged. Permission-pending features remain empty placeholders.</p>
    <div class="card">
      <h2>App policy</h2>
      <ul class="policy" id="policy"></ul>
    </div>
    <div id="sources"></div>
  </div>
  <script>
    async function load() {
      const [policyRes, registryRes] = await Promise.all([
        fetch('../app/assets/modules/data_sources.json'),
        fetch('../app/assets/modules/dataset_registry.json'),
      ]);
      const data = await policyRes.json();
      const registry = await registryRes.json();
      const policy = document.getElementById('policy');
      (data.app.policy || []).forEach((line) => {
        const li = document.createElement('li');
        li.textContent = line;
        policy.appendChild(li);
      });
      const root = document.getElementById('sources');
      (registry.datasets || []).forEach((s) => {
        const el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = `
          <h2>${s.title}</h2>
          <p><strong>Status:</strong> ${s.status}</p>
          <p><strong>License:</strong> ${s.license}</p>
          <p><strong>Owner:</strong> ${s.copyright_owner}</p>
          <p><strong>Contact:</strong> ${s.contact}</p>
          <p><strong>Offline:</strong> ${s.offline_redistribution ? 'Allowed' : 'Not approved'} · <strong>Commercial:</strong> ${s.commercial_distribution ? 'Allowed' : 'Not approved'}</p>
          <p>${s.attribution}</p>
          <p class="meta">${s.original_source}</p>
        `;
        root.appendChild(el);
      });
    }
    load().catch((e) => {
      document.getElementById('sources').innerHTML = `<div class="card"><p>Could not load data_sources.json (${e}). Open from the repo preview server.</p></div>`;
    });
  </script>
</body>
</html>
